name: Keep pull requests current

# Merges the base branch into this repository's open pull request branches and resolves the
# conflicts it can resolve safely. See .github/keep-prs-current/keep_prs_current.py.
#
# Level "pins": only the mechanical conflicts - the translation catalogs, the hashes
# pinned for them in ATTRIBUTION.toml, ROADMAP.md, docs/gaps.md and Cargo.lock.
# Level "all" (the schedule): also a catalog key written on both sides, the parity file by
# feature id, and code (recorded resolutions, mergiraf, additions-only unions), where a branch
# whose code was resolved must pass rustfmt, clippy and its crates' tests here before it is
# pushed.
#
# The plan comes first: mergiraf, the Rust toolchain and the cargo cache are set up only when
# some branch needs them. A scheduled run pushes the merge commits it can make; a person can start
# it by hand, as a dry run (the default) or with "push" ticked. Branches in
# .github/keep-prs-current/skip.txt are left alone.
#
# Only a branch that really conflicts with the base branch is merged, at most once a day each; a
# pull request someone other than its author reviewed or commented on in the last 7 days (or that
# has an approval) gets no code resolution. The level comes from the repository variable
# KEEPER_LEVEL (all when unset; "pins" or "off" to hold it back); a manual run's input wins.
#
# Two jobs: "merge" builds and tests with a read-only token and hands the checked merge commits
# over as a git bundle; "push" (the only job that can write) pushes those that are still
# fast-forwards of the heads that were checked, and rewrites the "PR keeper digest" issue here.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the merge commits (leave off for a dry run)"
        type: boolean
        default: false
      level:
        description: "pins: catalogs, ATTRIBUTION and Cargo.lock only. all: also same-key catalog rows, the parity file and code (checked with cargo)"
        type: choice
        options: [pins, all]
        default: pins
      only:
        description: "Only these branches, comma-separated (blank: every open pull request)"
        type: string
        default: ""
      replay:
        description: "Rehearse on these merge commits instead of the open branches (comma-separated; never pushes)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: keep-prs-current
  cancel-in-progress: false

jobs:
  merge:
    if: (inputs.level || vars.KEEPER_LEVEL || 'all') != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      planned: ${{ steps.plan.outcome == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: storytold/pdfcraft
      PR_AUTHOR: ${{ github.repository_owner }}
      FORK_REMOTE: origin
      UPSTREAM_REMOTE: upstream
      LEVEL: ${{ inputs.level || vars.KEEPER_LEVEL || 'all' }}
      PUSH: ${{ (github.event_name == 'schedule' || inputs.push) && '1' || '' }}
      ONLY: ${{ inputs.only }}
      REPLAY: ${{ inputs.replay }}
      KEEPER: .github/keep-prs-current/keep_prs_current.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # What earlier runs left: the keeper's pushes (one a day per branch), the merges that failed
      # (not tried again until something changes) and the tests that fail on the base branch.
      - name: Restore the keeper's memory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/keeper/memory.json
          key: keep-prs-memory-${{ github.run_id }}
          restore-keys: keep-prs-memory-

      - name: Add the upstream remote
        run: |
          git remote add upstream https://github.com/storytold/pdfcraft.git
          git config rerere.enabled false
          mkdir -p .git/rr-cache

      # How people resolved code conflicts on these branches before, learned from their merge
      # commits and kept between runs. Used (level all) only after the same checks as any other
      # resolution.
      - name: Restore the recorded resolutions
        if: env.LEVEL == 'all'
        uses: actions/cache/restore@v4
        with:
          path: .git/rr-cache
          key: keep-prs-rerere-${{ github.run_id }}
          restore-keys: keep-prs-rerere-

      - name: Plan
        id: plan
        run: python3 "$KEEPER" classify

      - name: Install mergiraf
        if: steps.plan.outputs.needs_mergiraf == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mergiraf.tar.gz" \
            https://codeberg.org/mergiraf/mergiraf/releases/download/v0.20.0/mergiraf_x86_64-unknown-linux-musl.tar.gz
          echo "fc77469be936b02ab9021b984a3aebc9250a21ae3d264f2ef2198eb8b31b2a7b  $RUNNER_TEMP/mergiraf.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/mergiraf.tar.gz" -C "$RUNNER_TEMP/bin" mergiraf
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Resolve
        id: resolve
        run: python3 "$KEEPER" resolve

      # Everything below up to the report runs only when a branch's code was resolved.
      - name: Make room on the disk (only when short of it)
        if: steps.resolve.outputs.needs_cargo == 'true'
        run: |
          df -h /
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 40 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi

      - name: Linux libraries for the build
        if: steps.resolve.outputs.needs_cargo == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev qpdf poppler-utils

      - name: Rust toolchain
        if: steps.resolve.outputs.needs_cargo == 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Restore the cargo cache
        id: cargo-cache
        if: steps.resolve.outputs.needs_cargo == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/keep-prs-target
          key: keep-prs-cargo-${{ steps.plan.outputs.lock }}
          restore-keys: keep-prs-cargo-

      - name: Check the resolved branches
        if: steps.resolve.outputs.needs_cargo == 'true'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: python3 "$KEEPER" verify

      - name: Save the cargo cache
        if: always() && steps.resolve.outputs.needs_cargo == 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/keep-prs-target
          key: keep-prs-cargo-${{ steps.plan.outputs.lock }}

      - name: Bundle the checked merge commits
        if: always() && steps.plan.outcome == 'success'
        run: python3 "$KEEPER" bundle

      - name: Hand them to the push job
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: keeper
          path: ${{ runner.temp }}/keeper/
          retention-days: 3
          if-no-files-found: error

      - name: Save the recorded resolutions
        if: always() && env.LEVEL == 'all'
        uses: actions/cache/save@v4
        with:
          path: .git/rr-cache
          key: keep-prs-rerere-${{ github.run_id }}

  push:
    needs: merge
    if: always() && needs.merge.outputs.planned == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: storytold/pdfcraft
      FORK_REMOTE: origin
      LEVEL: ${{ inputs.level || vars.KEEPER_LEVEL || 'all' }}
      PUSH: ${{ (github.event_name == 'schedule' || inputs.push) && '1' || '' }}
      ONLY: ${{ inputs.only }}
      REPLAY: ${{ inputs.replay }}
      KEEPER: .github/keep-prs-current/keep_prs_current.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Take the checked merge commits
        uses: actions/download-artifact@v4
        with:
          name: keeper
          path: ${{ runner.temp }}/keeper

      - name: Push and report
        run: python3 "$KEEPER" finish

      - name: Save the keeper's memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/keeper/memory.json
          key: keep-prs-memory-${{ github.run_id }}
